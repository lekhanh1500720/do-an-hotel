<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Details - HotelManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="container">
    <a href="hotels.html" class="btn btn-ghost btn-sm mb-2">← Back to hotels</a>

    <div id="hotel-detail" class="mb-3"></div>

    <div class="card mb-2">
      <h3 class="card-title">Check Availability</h3>
      <form id="availability-form" class="filter-bar">
        <div class="form-group">
          <label for="check_in">Check-in</label>
          <input type="date" id="check_in" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="check_out">Check-out</label>
          <input type="date" id="check_out" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Check availability</button>
      </form>
    </div>

    <div id="availability-banner" class="mb-2"></div>
    <h2 class="page-title" style="font-size:1.3rem">Rooms</h2>
    <div id="room-list" class="mt-2"></div>

    <div class="card mt-3">
      <div id="reviews"></div>
    </div>
  </div>

  <footer>© 2026 HotelManager. All rights reserved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roomDetails.js"></script>
</body>
</html>
