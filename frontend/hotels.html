<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Hotels - HotelManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Search Hotels</h1>
        <p class="page-subtitle">Filter by city, price range and star rating.</p>
      </div>
    </div>

    <form id="search-form" class="filter-bar">
      <div class="form-group">
        <label for="filter-city">City</label>
        <input type="text" id="filter-city" class="form-control" placeholder="e.g. Mumbai">
      </div>
      <div class="form-group">
        <label for="filter-min">Min price / night</label>
        <input type="number" id="filter-min" class="form-control" placeholder="Any">
      </div>
      <div class="form-group">
        <label for="filter-max">Max price / night</label>
        <input type="number" id="filter-max" class="form-control" placeholder="Any">
      </div>
      <div class="form-group">
        <label for="filter-stars">Star rating</label>
        <select id="filter-stars" class="form-control">
          <option value="">Any</option>
          <option value="5">5 ★</option>
          <option value="4">4 ★</option>
          <option value="3">3 ★</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="hotel-grid" class="hotel-grid"></div>
  </div>

  <footer>© 2026 HotelManager. All rights reserved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hotels.js"></script>
</body>
</html>
