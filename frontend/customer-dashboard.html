<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - HotelManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="welcome">My Bookings</h1>
        <p class="page-subtitle">View, pay and manage your stays.</p>
      </div>
      <a href="hotels.html" class="btn btn-primary">Book a room</a>
    </div>

    <div id="bookings-list"></div>
  </div>

  <!-- Review modal -->
  <div id="review-modal" style="display:none;position:fixed;inset:0;background:rgba(22,42,68,0.55);z-index:100;align-items:center;justify-content:center;padding:1rem;">
    <div class="card" style="max-width:440px;width:100%;">
      <h3 class="card-title">Leave a Review</h3>
      <form id="review-form">
        <input type="hidden" id="review-hotel-id">
        <div class="form-group">
          <label for="review-rating">Rating</label>
          <select id="review-rating" class="form-control">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Fair</option>
            <option value="1">1 - Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label for="review-comment">Comment</label>
          <textarea id="review-comment" class="form-control" placeholder="Share your experience..."></textarea>
        </div>
        <div class="flex">
          <button type="submit" class="btn btn-primary">Submit Review</button>
          <button type="button" class="btn btn-ghost" onclick="closeReview()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer>© 2026 HotelManager. All rights reserved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
